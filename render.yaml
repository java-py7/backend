services:
  - type: web
    name: vendorcoinpay-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: vendorcoinpay-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: vendorcoinpay-db
    databaseName: vendorcoinpay
    user: vendorcoinpay_user
    plan: free
